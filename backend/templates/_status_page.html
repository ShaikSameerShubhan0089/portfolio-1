<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>{% block title %}{% endblock %} | Sameer Shaik</title>
  {% include "_head_assets.html" %}
</head>
<body class="status-body">
  <header class="site-header is-scrolled">
    <div class="container header-bar">
      <a href="{{ url_for('index') }}" class="wordmark"><img class="wordmark-logo" src="{{ url_for('static', filename='images/logo.webp') }}" alt="" width="44" height="44"><span>Sameer Shaik</span></a>
      <button type="button" class="theme-toggle" data-theme-toggle aria-pressed="false" aria-label="Switch to dark mode" hidden>
        <svg class="icon-sun" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
        <svg class="icon-moon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M20.5 14.5A8.5 8.5 0 0 1 9.5 3.5a8.5 8.5 0 1 0 11 11Z"/></svg>
      </button>
    </div>
  </header>
  <main class="container status-page" id="main">
    <div class="status-card">
      <p class="status-eyebrow">{% block eyebrow %}{% endblock %}</p>
      <h1 class="status-title">{% block heading %}{% endblock %}</h1>
      {% block body %}{% endblock %}
    </div>
  </main>
</body>
</html>
